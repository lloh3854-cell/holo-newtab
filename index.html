<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новая вкладка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #2a2a3e 0%, #0f0f1a 50%, #000 100%);
    color: #fff;
    position: relative;
  }

  /* Мягкое свечение на фоне */
  body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(120, 100, 255, 0.25) 0%, transparent 70%);
    top: -200px;
    left: -200px;
    filter: blur(80px);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 100, 180, 0.15) 0%, transparent 70%);
    bottom: -200px;
    right: -150px;
    filter: blur(80px);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 20px;
    width: 100%;
    max-width: 640px;
  }

  .clock {
    font-size: 72px;
    font-weight: 300;
    letter-spacing: -2px;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    font-variant-numeric: tabular-nums;
  }

  .greeting {
    font-size: 16px;
    font-weight: 300;
    color: rgba(255, 255, 255, 0.5);
    margin-top: -20px;
    letter-spacing: 0.5px;
  }

  .search-form {
    width: 100%;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 4px 4px 4px 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.3s ease;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .search-form:focus-within {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 40px rgba(120, 100, 255, 0.25);
  }

  .search-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    opacity: 0.5;
  }

  .search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    padding: 16px 12px;
  }

  .search-input::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }

  .search-button {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 20px;
    padding: 12px 24px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .search-button:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .search-button:active {
    transform: scale(0.96);
  }

  .yandex-mark {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.5px;
  }

  .yandex-mark span {
    color: rgba(255, 100, 100, 0.7);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="clock" id="clock">00:00</div>
    <div class="greeting" id="greeting">Добро пожаловать</div>

    <form class="search-form" action="https://yandex.ru/search/" method="GET" target="_top">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        name="text"
        class="search-input"
        placeholder="Поиск в Яндексе..."
        autocomplete="off"
        autofocus
      >
      <button type="submit" class="search-button">Найти</button>
    </form>

    <div class="yandex-mark">поиск через <span>Яндекс</span></div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock').textContent = hours + ':' + minutes;

    const h = now.getHours();
    let greeting = 'Доброй ночи';
    if (h >= 5 && h < 12) greeting = 'Доброе утро';
    else if (h >= 12 && h < 18) greeting = 'Добрый день';
    else if (h >= 18 && h < 23) greeting = 'Добрый вечер';
    document.getElementById('greeting').textContent = greeting;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
