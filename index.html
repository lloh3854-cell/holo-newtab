if(isBS){e.preventDefault();active=false;el.classList.remove('tf-active');if(onDelete)onDelete();else setWidgetHidden(id,true);return}
if(!isS&&!isR)return;e.preventDefault();mode=isS?'scale':'rotate';sx=lastMouse.x;sy=lastMouse.y;ss={...state};showHud(mode==='scale'?'МАСШТАБ':'ПОВОРОТ')};
el.addEventListener('mousedown',onDown,{signal:sig});window.addEventListener('mousemove',onMove,{signal:sig});window.addEventListener('mouseup',onUp,{signal:sig});window.addEventListener('keydown',onKey,{signal:sig});el.addEventListener('dragstart',e=>e.preventDefault(),{signal:sig});
const ctrl={reset(){state.x=0;state.y=0;state.s=1;state.r=0;apply();save()},abort(){try{ac.abort()}catch{}delete tfControllers[id]}};tfControllers[id]=ctrl;return ctrl}
makeTransformable(document.querySelector('.clock-block'),'clock');
makeTransformable(document.querySelector('.search-wrap'),'search',{skipTargets:'input,textarea,button'});
makeTransformable(document.getElementById('settingsBtn'),'settingsBtn');
(async()=>{try{
updateI18nAll();
await dbReady;
const all=await dbGetAll();
for(const f of all.filter(i=>i.id.startsWith('fnt_')))await registerFontFace(f.id,f.blob,f.name||'Custom');
for(const m of getTextures())await createTextureSource(m.id);
const savedW=safeStorage.get('wallpaper');
if(savedW){try{currentWallpaperState=JSON.parse(savedW)}catch{}}
const savedD=safeStorage.get('depthMap');
if(savedD){try{currentDepthState=JSON.parse(savedD)}catch{}}
const savedDE=safeStorage.get('depthEnabled')==='true';
depthEnabled=savedDE;depthToggle.checked=savedDE;depthPanel.style.display=savedDE?'block':'none';
if(currentWallpaperState)await applyWallpaper(currentWallpaperState);
await renderGrid();
if(savedDE&&currentDepthState&&currentWallpaperState){await applyDepthMap(currentDepthState)}
renderSites();renderFontList();renderTextureList();renderAllSelects();
renderTextWidgets();renderTextWidgetsSettings();
await renderGraphicWidgets();renderGraphicWidgetsSettings();
applyAllFonts();applyAllTextures();applyAllOpacity();
setTimeout(()=>applyAllTextures(),1500);
updateLockUI();applyHiddenStates();
}catch(e){console.error('Init error:',e)}})();
</script>
</body>
</html>
